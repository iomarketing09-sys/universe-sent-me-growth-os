version: 1

ownership:
  accountable: Fernando
  operator: CGO
  functional_owner: operations
  note: "Sensor externo del NOC. No es un edificio nuevo ni reemplaza al watchdog interno."

alert_channel:
  type: telegram
  target: "Growth OS Ops"
  note: "Grupo compartido Fernando + CGO. Los tenants solo reciben su status page filtrado."

monitors:
  - id: host-heartbeat
    name: "Host Growth OS"
    type: heartbeat
    description: "El host envía un latido cada 5 minutos; si deja de llegar, el proveedor alerta."
    interval_seconds: 300
    grace_seconds: 300
    severity: critical
    functional_owner: operations
    signal: "scripts/ping_external_monitor.py"
    runbook: "docs/OPERACION_COMPARTIDA.md#monitor-externo"

  - id: whatsapp-webhook
    name: "Webhook WhatsApp Flexi"
    type: http
    description: "Disponibilidad del worker y de su acceso a D1."
    url: "https://flexi-whatsapp-webhook.io-marketing-09.workers.dev/health"
    method: GET
    expected_status: 200
    expected_json_status: "ok"
    interval_seconds: 300
    severity: critical
    functional_owner: communications
    runbook: "docs/OPERACION_COMPARTIDA.md#monitor-externo"
