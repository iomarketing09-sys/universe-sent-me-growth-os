name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/growthos-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "core/growthos-core[dev]" requests pyyaml

      - name: Run core tests
        run: python -m pytest core/growthos-core/tests/ -q

      - name: Run integration tests
        run: python -m pytest tests/ -q

      - name: Verify canonical inventory is reproducible
        env:
          PYTHONPATH: core/growthos-core
        run: |
          python -m growthos.scripts.audit_inventory \
            --source GrowthOS/Content_Inventory.csv \
            --output /tmp/growthos-canonical \
            --overrides GrowthOS/Content_Inventory_OVERRIDES.csv
          cmp /tmp/growthos-canonical/Content_Inventory_CANONICAL.csv GrowthOS/Content_Inventory_CANONICAL.csv
          cmp /tmp/growthos-canonical/Content_Inventory_RECONCILIATION.csv GrowthOS/Content_Inventory_RECONCILIATION.csv
          cmp /tmp/growthos-canonical/Content_Inventory_OVERRIDES.csv GrowthOS/Content_Inventory_OVERRIDES.csv
