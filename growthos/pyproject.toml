[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growthos"
version = "0.1.0"
description = "Growth OS - Operational package for Universe Sent Me content pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.entry-points.console_scripts]
growthos = "growthos.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["growthos*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C4", "ANN", "ARG", "PTH", "SIM", "T20"]
ignore = ["ANN401", "ARG001", "ARG002", "T201"]
[tool.ruff.lint.flake8-type-checking]
message = "Avoid importing for type checking only at runtime"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["growthos"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
